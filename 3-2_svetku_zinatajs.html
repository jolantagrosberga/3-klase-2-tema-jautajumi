<!DOCTYPE html>
<html lang="lv">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Svētku zinātājs</title>
<style>
  *,*::before,*::after{box-sizing:border-box;margin:0;padding:0;}
  :root{
    --bg:#FBF9F6;--surface:#fff;--line:#E3DCD4;--soft:#F4EFE9;
    --text:#1F3348;--muted:#6D7B88;--blue:#2E74B5;--terra:#C75000;
    --ok:#2D8A3E;--no:#C0392B;
  }
  html,body{height:100%;overflow:hidden;background:var(--bg);}
  body{font-family:'Candara','Aptos','Segoe UI',sans-serif;color:var(--text);-webkit-user-select:none;user-select:none;touch-action:none;}
  #frame{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;overflow:hidden;}
  #stage{width:1600px;height:900px;flex:0 0 auto;transform-origin:center center;padding:22px 36px 22px;display:flex;flex-direction:column;position:relative;}
  header{display:flex;align-items:flex-end;justify-content:space-between;gap:20px;margin-bottom:14px;}
  h1{font-size:40px;letter-spacing:-0.5px;line-height:1;}
  h1 small{display:block;font-size:19px;color:var(--muted);letter-spacing:0;margin-top:6px;font-weight:400;}
  .tabs{display:flex;gap:8px;background:var(--soft);padding:6px;border-radius:18px;}
  .tab{font-family:inherit;font-size:21px;padding:11px 22px;border-radius:13px;border:0;background:transparent;color:var(--text);cursor:pointer;}
  .tab.on{background:var(--blue);color:#fff;}
  .card{background:var(--surface);border:1px solid var(--line);border-radius:22px;padding:18px 20px;}
  .label{font-size:14px;letter-spacing:0.12em;text-transform:uppercase;color:var(--muted);margin-bottom:8px;}
  .btn{font-family:inherit;font-size:20px;padding:12px 22px;border-radius:14px;border:1px solid var(--line);background:#fff;color:var(--text);cursor:pointer;}
  .btn.main{background:var(--blue);border-color:var(--blue);color:#fff;}
  .btn.terra{background:var(--terra);border-color:var(--terra);color:#fff;}
  .btn:active{transform:scale(0.97);}
  .btn:focus-visible,.tab:focus-visible{outline:4px solid var(--terra);outline-offset:3px;}
  .btn[disabled]{opacity:.4;cursor:default;}

  .main{display:flex;gap:24px;flex:1;min-height:0;}
  .side{width:320px;flex-shrink:0;display:flex;flex-direction:column;gap:14px;}
  .big{font-size:34px;line-height:1.1;}
  .bar{height:14px;border-radius:8px;background:#EFE8E0;overflow:hidden;margin-top:10px;}
  .bar span{display:block;height:100%;width:0;background:var(--ok);transition:width .4s;}
  .dots{display:flex;flex-wrap:wrap;gap:8px;margin-top:14px;}
  .dot{width:22px;height:22px;border-radius:50%;background:#EFE8E0;}
  .dot.now{background:var(--blue);} .dot.ok{background:var(--ok);} .dot.no{background:var(--no);}
  .qcard{flex:1;min-width:0;background:#fff;border:1px solid var(--line);border-radius:24px;padding:26px 30px;display:flex;flex-direction:column;}
  #quiz{display:flex;gap:28px;flex:1;min-height:0;}
  .pic{width:470px;flex-shrink:0;display:flex;flex-direction:column;gap:12px;}
  .pic .img{width:470px;height:352px;border-radius:18px;overflow:hidden;background:#F4EFE9;display:flex;align-items:center;justify-content:center;}
  .pic img{width:100%;height:100%;object-fit:cover;}
  .pic .img svg{width:300px;height:300px;}
  .qright{flex:1;min-width:0;display:flex;flex-direction:column;}
  .qnum{font-size:15px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);}
  .q{font-size:30px;line-height:1.25;margin:8px 0 18px;}
  .opts{display:flex;flex-direction:column;gap:10px;}
  .opt{font-family:inherit;font-size:21px;text-align:left;padding:13px 18px;border-radius:16px;border:2px solid var(--line);background:#fff;color:var(--text);cursor:pointer;display:flex;align-items:center;gap:14px;}
  .opt svg{width:48px;height:48px;flex-shrink:0;}
  .opt .l{width:34px;height:34px;border-radius:50%;background:var(--soft);display:flex;align-items:center;justify-content:center;font-weight:700;flex-shrink:0;}
  .opt:hover:not([disabled]){border-color:var(--blue);}
  .opt.ok{border-color:var(--ok);background:#EAF6EC;} .opt.ok .l{background:var(--ok);color:#fff;}
  .opt.no{border-color:var(--no);background:#FBECEA;} .opt.no .l{background:var(--no);color:#fff;}
  .opt[disabled]{cursor:default;}
  .icons .opts{display:grid;grid-template-columns:1fr 1fr;}
  .icons .opt{flex-direction:column;justify-content:center;text-align:center;}
  .icons .opt svg{width:84px;height:84px;}
  .fb{font-size:19px;line-height:1.45;background:#F7F3EE;border-radius:16px;padding:14px 18px;display:none;}
  .fb.on{display:block;}
  .fb b{font-weight:700;} .fb.ok b{color:var(--ok);} .fb.no b{color:var(--no);}
  .btnrow{display:flex;justify-content:flex-end;gap:12px;margin-top:14px;}
  .btn[hidden]{display:none;}
  .btnrow .btn{flex:0 0 auto;width:auto;}
  .deco{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:auto;opacity:.9;}
  .deco svg{width:100%;height:70px;}
  .final{display:none;flex-direction:column;align-items:center;justify-content:center;flex:1;text-align:center;gap:16px;}
  .final.on{display:flex;}
  .final svg{width:150px;height:150px;}
  .final .score{font-size:64px;}
  .final .msg{font-size:24px;color:var(--muted);max-width:680px;line-height:1.45;}
</style>
</head>
<body>
<div id="frame"><div id="stage">
  <header>
    <h1>Svētku zinātājs<small>Jautājumi par formām, stilizāciju, simetriju un svētku simboliem</small></h1>
  </header>
  <div class="main">
    <div class="side">
      <div class="card">
        <div class="label">Pareizās atbildes</div>
        <div class="big"><span id="score">0</span> no <span id="total">0</span></div>
        <div class="bar"><span id="bar"></span></div>
        <div class="dots" id="dots"></div>
      </div>
      <div class="card" style="flex:1;display:flex;flex-direction:column">
        <div class="label">Padoms</div>
        <p style="font-size:19px;line-height:1.5;color:var(--muted)" id="advice"></p>
        <div class="deco" id="deco"></div>
      </div>
    </div>
    <div class="qcard">
      <div id="quiz">
        <div class="pic"><div class="img" id="img"></div><div class="fb" id="fb"></div></div>
        <div class="qright" id="qright">
          <div class="qnum" id="qnum"></div>
          <div class="q" id="q"></div>
          <div class="opts" id="opts"></div>
          <div class="btnrow" style="margin-top:auto">
            <button class="btn" id="restart">Sākt no jauna</button>
            <button class="btn main" id="next" hidden>Nākamais jautājums</button>
          </div>
        </div>
      </div>
      <div class="final" id="final">
        <div id="fic"></div>
        <div class="score" id="fscore"></div>
        <div class="msg" id="fmsg"></div>
        <button class="btn main" id="again">Spēlēt vēlreiz</button>
      </div>
    </div>
  </div>
</div></div>

const stage=document.getElementById('stage');

function fit(){SCALE=Math.min(window.innerWidth/1600,window.innerHeight/900);stage.style.transform='scale('+SCALE+')';}
function reportHeight(){window.parent.postMessage({iframeHeight:Math.round(window.innerWidth*9/16)},'*');}
window.addEventListener('resize',()=>{fit();reportHeight();});
window.addEventListener('load',()=>{fit();reportHeight();});
fit();reportHeight();
function shuffle(a){a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;}

const ADV=['Nesteidzies! Izlasi visas atbildes, pirms izvēlies.','Vērīgi paskaties uz attēlu: kādas formas tajā slēpjas?','Dažas atbildes izklausās pareizas. Izvēlies precīzāko!','Stilizācijā ir svarīgi vienkāršot formu tā, lai to joprojām varētu atpazīt.','Simetrisks ir tas, ko ar asi var sadalīt divās vienādās pusēs.'];
let i=0,score=0,results=[],order=[];
const $=id=>document.getElementById(id);
function start(){i=0;score=0;results=[];$('final').classList.remove('on');$('quiz').style.display='flex';show();}
function show(){
  const q=Q[i];
  $('qnum').textContent=(i+1)+'. jautājums no '+Q.length;
  $('q').textContent=q.q;
  $('img').innerHTML=q.img?`<img src="${IMG[q.img]}" alt="">`:iconSVG(q.ic);
  $('qright').classList.toggle('icons',!!q.grid);
  const L='ABCD';
  $('opts').innerHTML=q.o.map((o,k)=>Array.isArray(o)?`<button class="opt" data-k="${k}">${iconSVG(o[0])}<span>${o[1]}</span></button>`:`<button class="opt" data-k="${k}"><span class="l">${L[k]}</span><span>${o}</span></button>`).join('');
  $('opts').querySelectorAll('.opt').forEach(b=>b.onclick=()=>answer(+b.dataset.k));
  $('fb').className='fb';$('next').hidden=true;
  $('advice').textContent=ADV[i%ADV.length];
  upd();
}
function answer(k){
  const q=Q[i],ok=k===q.a;if(ok)score++;results[i]=ok;
  $('opts').querySelectorAll('.opt').forEach((b,j)=>{b.disabled=true;if(j===q.a)b.classList.add('ok');else if(j===k)b.classList.add('no');});
  $('fb').className='fb on '+(ok?'ok':'no');
  $('fb').innerHTML=(ok?'<b>Pareizi!</b> ':'<b>Ne gluži.</b> ')+q.e;
  $('next').hidden=false;$('next').textContent=i===Q.length-1?'Skatīt rezultātu':'Nākamais jautājums';
  upd();
}
function upd(){
  $('score').textContent=score;$('total').textContent=Q.length;
  $('bar').style.width=(results.filter(x=>x!==undefined).length/Q.length*100)+'%';
  $('dots').innerHTML=Q.map((_,j)=>`<div class="dot ${results[j]===true?'ok':results[j]===false?'no':j===i?'now':''}"></div>`).join('');
}
$('next').onclick=()=>{if(i<Q.length-1){i++;show();}else fin();};
function fin(){
  $('quiz').style.display='none';$('final').classList.add('on');
  $('fscore').textContent=score+' no '+Q.length;
  const p=score/Q.length;
  $('fic').innerHTML=iconSVG(p>=0.8?'saule':p>=0.5?'puzurs':'pupoli');
  $('fmsg').textContent=p>=0.8?'Lieliski! Tu pazīsti ģeometriskās figūras, proti stilizēt un saskatīt simetriju.':p>=0.5?'Labi! Tu jau daudz zini. Vēlreiz apskati Formu detektīvu un Simetrijas spoguli un pamēģini atkal!':'Vēl jāpamācās. Atkārto, kā formas saskatīt un vienkāršot, un pamēģini vēlreiz!';
}
$('restart').onclick=start;$('again').onclick=start;
document.getElementById('deco').innerHTML=['puzurs','ragavas','ola','ozolvainags','abols','gailis'].map(k=>iconSVG(k)).join('');
start();
</script>
